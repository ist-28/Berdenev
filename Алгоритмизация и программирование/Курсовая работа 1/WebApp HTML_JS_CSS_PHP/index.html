<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <title>Аптека</title>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container">
          <span class="navbar-brand mb-1">Все лекарства</span>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a id="card" class="nav-link" aria-current="page" href="pages/card.html">Корзина</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Найти..." aria-label="Search">
            <button class="btn btn-outline-info me-2" type="submit">Поиск</button>
          </form>
        </div>
      </nav>
    </header>
    <main class="main">
      <div class="container mt-5">
        <section class="d-flex justify-content-end"><!---->
          <a class="btn btn-outline-success mb-2" href="pages/AddPills.html">Добавить лекарство</a>
        </section>
        <section class="table-responsive"> <!--Таблица-->
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="col-num asc" role="button" aria-label="Id">№</th>
                <th scope="col" class="desc" role="button" aria-label="Title">Название</th>
                <th scope="col" class="desc" role="button" aria-label="Type">Тип лекарства</th>
                <th scope="col" class="desc" role="button" aria-label="Year">Год производства</th>
                <th scope="col" class="desc" role="button" aria-label="Country">Страна производитель</th>
                <th scope="col" class="desc" role="button" aria-label="Price">Стоимость</th>
                <th scope="col" class="desc" role="button" aria-label="Count">Количество</th>
              </tr>
            </thead>
            <tbody class="table-group-divider">
              <tr data-id="1">
                <th scope="row">1</th>
                <td>Парацетамол</td>
                <td>Таблетки</td>
                <td>2009</td>
                <td>Россия</td>
                <td>50р</td>
                <td>
                  <div class="counter d-flex justify-content-between">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="20">0/20</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
              </tr>
              <tr data-id="2">
                <th scope="row">2</th>
                <td>Пенталгин</td>
                <td>Таблетки</td>
                <td>2010</td>
                <td>Россия</td>
                <td>150р</td>
                <td>
                  <div class="counter d-flex justify-content-between">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="20">0/20</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
              </tr>
              <tr data-id="3">
                <th scope="row">3</th>
                <td>Доктор Мом</td>
                <td>Микстура</td>
                <td>2011</td>
                <td>Россия</td>
                <td>230р</td>
                <td>
                  <div class="counter d-flex justify-content-between">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="10">0/10</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="container-fluid bg-dark d-flex justify-content-center">
        <p class="mt-3 mb-3">© Все права защищены</p>
      </div>
    </footer>
  </div>

  <script src="scripts/bootstrap.bundle.min.js"></script>
  <script src="scripts/jquery-3.7.1.min.js"></script>
  <script src="scripts/scripts.js"></script>
</body>

</html>
