<!DOCTYPE html>

<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <title>Добавить лекарство</title>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark"> <!--Шапка-->
        <div class="container">
          <span class="navbar-brand mb-1">Добавление лекарств</span>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="../index.html">Все лекарства</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="card.html">Корзина</a></a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main">
      <div class="container mt-5">
        <section class="d-flex justify-content-center">
          <form class="form w-75" id="AddPills-form">
            <div class="d-flex ms-4 gap-2 mt-4">
              <div class="mb-3 col-md-8">
                <label for="Title" class="form-label">Название</label>
                <input type="text" class="form-control" id="Title">
              </div>
              <div class="mb-3 col-md-3">
                <label for="Type" class="form-label">Тип лекарства</label>
                <input type="text" class="form-control" id="Type">
              </div>
            </div>
            <div class="d-flex ms-4 gap-2">
              <div class="mb-3 col-md-8">
                <label for="Country" class="form-label">Страна производитель</label>
                <input type="text" class="form-control" id="Country">
              </div>
              <div class="mb-3 col-md-3">
                <label for="Year" class="form-label">Год производства</label>
                <input type="text" class="form-control" id="Year">
              </div>
            </div>
            <div class="d-flex ms-4 gap-2">
              <div class="mb-3 col-md-2">
                <label for="Price" class="form-label">Стоимость</label>
                <input type="text" class="form-control" id="Price">
              </div>
              <div class="mb-3 col-md-2">
                <label for="Count" class="form-label">Количество</label>
                <input type="text" class="form-control" id="Count">
              </div>
            </div>
            <div class="d-flex gap-2 mb-3 ms-4">
              <button class="btn btn-outline-success" id="AddPills">Добавить</button>
              <select class="form-select w-auto" id="add-type">
                <option selected value="start">В начало</option>
                <option value="end">В конец</option>
                <option value="before">Перед выбранным</option>
                <option value="after">После выбранного</option>
              </select>
              <div id="medicine-select" style="display: none;">
                <select class="form-select w-auto" id="medicine"></select>
              </div>
            </div>
          </form>
        </section><!--Форма добавления-->
      </div>
    </main>
    <footer class="footer">
      <div class="container-fluid bg-dark d-flex justify-content-center">
        <p class="mt-3 mb-3">© Все права защищены</p>
      </div>
    </footer>
  </div>

  <script src="../scripts/bootstrap.bundle.min.js"></script>
  <script src="../scripts/jquery-3.7.1.min.js"></script>
  <script src="../scripts/scripts.js"></script>
</body>

</html>
