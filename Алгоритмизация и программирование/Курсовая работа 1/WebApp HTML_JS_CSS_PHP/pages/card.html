<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <title>Корзина</title>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark"> <!--Шапка-->
        <div class="container">
          <span class="navbar-brand mb-1">Корзина</span>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="../index.html">Все лекарства</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main">
      <div class="container mt-5">
        <section class="d-flex justify-content-end"><!--Кнопка добавления-->
          <button class="clear-card btn btn-outline-danger mb-2">Очистить корзину</button>
        </section>
        <section class="table-responsive" id="card"> <!--Таблица-->
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="col-num desc" role="button" aria-label="Id">№</th>
                <th scope="col" class="desc" role="button" aria-label="Title">Название</th>
                <th scope="col" class="desc" role="button" aria-label="Category">Категория</th>
                <th scope="col" class="desc" role="button" aria-label="Type">Тип лекарства</th>
                <th scope="col" class="desc" role="button" aria-label="Year">Год производства</th>
                <th scope="col" class="desc" role="button" aria-label="Manufacturer">Производитель</th>
                <th scope="col" class="desc" role="button" aria-label="Price">Стоимость</th>
                <th scope="col" class="desc" role="button" aria-label="Count">Количество</th>
                <th scope="col" aria-label="Delete">Удалить</th>
              </tr>
            </thead>
            
          </table>
        </section>
      </div>
    </main>
<footer class="footer">
      <div class="container-fluid bg-dark d-flex justify-content-center">
          <p class="mt-3 mb-3">© Все права защищены</p>
      </div>
    </footer>
  </div>

  <script src="../scripts/bootstrap.bundle.min.js"></script>
  <script src="../scripts/jquery-3.7.1.min.js"></script>
  <script src="../scripts/card.js"></script>
</body>

</html>
