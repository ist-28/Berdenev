<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <title>Корзина</title>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark"> <!--Шапка-->
        <div class="container">
          <span class="navbar-brand mb-1">Корзина</span>
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="../index.html">Все лекарства</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main class="main">
      <div class="container mt-5">
        <section class="d-flex justify-content-end"><!--Кнопка добавления-->
          <button class="clear-card btn btn-outline-danger mb-2">Очистить корзину</button>
        </section>
        <section class="table-responsive"> <!--Таблица-->
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="col-num asc" role="button" aria-label="Id">№</th>
                <th scope="col" class="desc" role="button" aria-label="Title">Название</th>
                <th scope="col" class="desc" role="button" aria-label="Type">Тип лекарства</th>
                <th scope="col" class="desc" role="button" aria-label="Year">Год производства</th>
                <th scope="col" class="desc" role="button" aria-label="Country">Страна производитель</th>
                <th scope="col" class="desc" role="button" aria-label="Price">Стоимость</th>
                <th scope="col" class="desc" role="button" aria-label="Count">Количество</th>
                <th scope="col" aria-label="Delete">Удалить</th>
              </tr>
            </thead>
            <tbody class="table-group-divider">
              <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
                <td>@mdo</td>
                <td>@mdo</td>
                <td>
                  <div class="counter">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="10">0</span>
                    <span>/10</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
                <td class="text-center">
                  <button class="btn btn-outline-danger">&#x2715;</button>
                </td>
              </tr>
              <tr>
                <th scope="row">2</th>
                <td>Jacob</td>
                <td>Thornton</td>
                <td>@fat</td>
                <td>@mdo</td>
                <td>@mdo</td>
                <td>
                  <div class="counter">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="10">0</span>
                    <span>/10</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
                <td class="text-center">
                  <button class="btn btn-outline-danger">&#x2715;</button>
                </td>
              </tr>
              <tr>
                <th scope="row">3</th>
                <td>John</td>
                <td>Doe</td>
                <td>@social</td>
                <td>@mdo</td>
                <td>@mdo</td>
                <td>
                  <div class="counter">
                    <button class="minus btn btn-outline-danger me-2">-</button>
                    <span class="count" data-max="10">0</span>
                    <span>/10</span>
                    <button class="plus btn btn-outline-success ms-2">+</button>
                  </div>
                </td>
                <td class="text-center">
                  <button class="btn btn-outline-danger">&#x2715;</button>
                </td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>
    </main>
    <footer class="footer">
      Footer
    </footer>
  </div>

  <script src="../scripts/bootstrap.bundle.min.js"></script>
  <script src="../scripts/jquery-3.7.1.min.js"></script>
  <script src="../scripts/scripts.js"></script>
</body>

</html>
